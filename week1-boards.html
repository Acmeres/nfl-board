<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Light palette is the complete set; the two dark blocks redefine tokens only. */
  :root{
    --ground:#EEF2F0; --surface:#FFFFFF; --ink:#101817; --muted:#5C6866;
    --rule:#D6DCDA; --accent:#1F6F5C; --accent-ink:#FFFFFF; --shadow:0 1px 2px rgba(16,24,23,.08);
  }
  :root{ --muted:#5C6866; }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0C1211; --surface:#141C1A; --ink:#E7EDEB; --muted:#93A19E;
      --rule:#25302E; --accent:#4FBFA0; --accent-ink:#08201D; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1211; --surface:#141C1A; --ink:#E7EDEB; --muted:#93A19E;
    --rule:#25302E; --accent:#4FBFA0; --accent-ink:#08201D; --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    background:var(--surface); border-bottom:1px solid var(--rule);
    padding:14px 20px 0; display:flex; flex-direction:column; gap:12px;
  }
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap}
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  h1{margin:2px 0 0; font-size:21px; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
  .meta{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px; color:var(--muted); margin-top:4px;
  }
  /* Segmented control: the two boards are peers, so they read as one object. */
  .tabs{display:flex; gap:0; border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--ground)}
  .tabs button{
    appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; padding:9px 18px;
    border-right:1px solid var(--rule); transition:background .12s,color .12s;
  }
  .tabs button:last-child{border-right:0}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
  .tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .panes{flex:1; position:relative; min-height:0}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--surface)}
  iframe[hidden]{display:none}
  .note{
    padding:7px 20px; background:var(--surface); border-top:1px solid var(--rule);
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px; color:var(--muted);
  }
  @media (max-width:620px){ .top{flex-direction:column} h1{font-size:18px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<header>
  <div class="top">

  </div>
</header>

  var META = {
    matchups: "16 games \u00b7 88 injured starters \u00b7 no prices on this board",
    props: "16 games \u00b7 429 props \u00b7 137 players \u00b7 429 rows"
  };
  var loaded = {};

  // Both source pages theme themselves from prefers-color-scheme and from a
  // data-theme stamp. Stamping the resolved wrapper theme onto the inner
  // document keeps an explicit light/dark choice from stopping at the frame.
  function resolvedTheme(){
    var stamped = document.documentElement.getAttribute("data-theme");
    if (stamped === "dark" || stamped === "light") return stamped;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function load(name){
    if (loaded[name]) return;
    var doc = atob(DATA[name]).replace("<html lang=\"en\">",
              '<html lang="en" data-theme="' + resolvedTheme() + '">');
    document.getElementById("pane-" + name).srcdoc = doc;
    loaded[name] = true;
  }

  function select(name){
    ["matchups","props"].forEach(function(n){
      var on = n === name;
      document.getElementById("tab-" + n).setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById("pane-" + n).hidden = !on;
    });
    document.getElementById("meta").innerHTML = META[name];
    load(name);
  }

  ["matchups","props"].forEach(function(n){
    document.getElementById("tab-" + n).addEventListener("click", function(){ select(n); });
  });

  // The prop board is 300 KB; it loads on first view rather than up front.
  select("matchups");
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    loaded = {};
    ["matchups","props"].forEach(function(n){
      if (!document.getElementById("pane-" + n).hidden) load(n);
    });
  });
